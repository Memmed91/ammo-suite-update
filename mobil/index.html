<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMMO">
<title>AMMO Mobil</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon192.png">
<link rel="apple-touch-icon" href="icons/icon180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Giriş -->
<section id="login" class="login hidden">
  <div class="login-card">
    <img src="icons/icon192.png" alt="" class="login-logo">
    <h1>AMMO Mobil</h1>
    <p class="muted">AMMO SUITE hesabınızla daxil olun</p>
    <form id="loginForm" autocomplete="on">
      <label>E-poçt<input id="loginEmail" type="email" inputmode="email" autocomplete="username" required></label>
      <label>Parol<input id="loginPass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary block" type="submit" id="loginBtn">Daxil ol</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>
</section>

<!-- Proqram -->
<section id="app" class="app hidden">
  <header class="top">
    <button class="icon-btn" id="backBtn" aria-label="Geri" hidden>‹</button>
    <div class="top-title"><b id="pageTitle">AMMO</b><small id="pageSub"></small></div>
    <button class="icon-btn" id="refreshBtn" aria-label="Yenilə">⟳</button>
  </header>
  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</section>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-card"><div class="sheet-grab"></div><div id="sheetBody"></div></div>
</div>
<div id="toast" class="toast"></div>
<div id="boot" class="boot"><img src="icons/icon192.png" alt=""><div class="spinner"></div></div>

<script src="app.js"></script>
</body>
</html>
