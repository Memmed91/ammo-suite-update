name: AMMO TAX asar yayimi

# Release dərc olunanda işləyir:
#  - release-də app.asar.part1..N varsa — birləşdirir (brauzer yükləmə limiti 10 MB olduğu üçün hissələrlə yüklənir)
#  - release mətnindəki "sha256: ..." ilə yoxlayır (uyğun deyilsə dayanır, feed dəyişmir)
#  - app.asar-ı release-ə qoyur, hissələri silir
#  - ammo-tax/update.json-u yeni versiyaya yönəldir → bütün kompüterlər ≤1 dəqiqəyə özü yenilənir
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ammo-tax-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Hisseleri birlesdir, yoxla, update.json-u yenile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          VER="${TAG#v}"
          WORK="$(mktemp -d)"
          cd "$WORK"
          gh release download "$TAG" -R "$REPO" -p 'app.asar*' || true
          ls -la
          HAVE_PARTS=0
          if ls app.asar.part* >/dev/null 2>&1; then
            HAVE_PARTS=1
            cat $(ls app.asar.part* | sort -V) > app.asar
          fi
          if [ ! -f app.asar ]; then
            echo "Bu release-de app.asar ve ya hisseleri yoxdur — kecilir."
            exit 0
          fi
          SIZE=$(stat -c%s app.asar)
          SHA=$(sha256sum app.asar | cut -d' ' -f1)
          BODY="$(gh release view "$TAG" -R "$REPO" --json body -q .body | tr -d '\r' || true)"
          EXP="$(printf '%s\n' "$BODY" | grep -oiE 'sha256:[[:space:]]*[0-9a-f]{64}' | grep -oiE '[0-9a-f]{64}' | head -1 || true)"
          echo "size=$SIZE sha=$SHA expected=${EXP:-yoxdur}"
          if [ "$SIZE" -lt 1000000 ]; then echo "Fayl cox kicikdir — dayandi."; exit 1; fi
          if [ -n "$EXP" ] && [ "$(printf '%s' "$EXP" | tr 'A-F' 'a-f')" != "$SHA" ]; then
            echo "SHA256 UYGUN DEYIL — feed deyisdirilmedi."; exit 1
          fi
          if [ "$HAVE_PARTS" = "1" ]; then
            gh release upload "$TAG" app.asar -R "$REPO" --clobber
            for p in app.asar.part*; do gh release delete-asset "$TAG" "$p" -R "$REPO" -y || true; done
          fi
          URL="https://github.com/$REPO/releases/download/$TAG/app.asar"
          printf '%s\n' "$BODY" | grep -viE '^[[:space:]]*sha256:' | sed '/^[[:space:]]*$/d' > notes.txt || true
          NOTES="$(jq -R . notes.txt | jq -s .)"
          cd "$GITHUB_WORKSPACE"
          mkdir -p ammo-tax
          jq -n --arg v "$VER" --arg u "$URL" --arg s "$SHA" --arg d "$(date -u +%F)" \
                --arg p "https://github.com/$REPO/releases" --argjson n "$NOTES" \
                '{version:$v, asar:$u, asarSha256:$s, notes:$n, date:$d, page:$p}' > ammo-tax/update.json
          cat ammo-tax/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ammo-tax/update.json
          git commit -m "ammo-tax feed -> $VER" || echo "deyisiklik yoxdur"
          git push origin HEAD:main

  # V31.16.9: KÖHNƏ versiyalı kompüterlər (məs. 31.8.0 — asar yeniləməsini bilmir, yalnız setup.exe ilə yenilənir)
  # üçün eyni versiyadan Windows quraşdırıcısı (NSIS) yığılır, release-ə qoyulur və feed-ə "setup" + "sha256" yazılır.
  # Beləcə HEÇ BİR müştəri kompüteri yenilənmədən kənarda qalmır — əlaqə heç vaxt itmir.
  installer:
    needs: publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Quraşdırıcı (setup.exe) yığ və feed-ə əlavə et
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          VER="${TAG#v}"
          W="$RUNNER_TEMP/inst"
          mkdir -p "$W"
          cd "$W"
          gh release download "$TAG" -R "$REPO" -p 'app.asar' || { echo "app.asar yoxdur — keçilir"; exit 0; }
          npx --yes @electron/asar@3.2.17 extract app.asar app
          cd app
          ls -la
          # pəncərə ikonu (build/icon.png) də paketə düşsün
          jq '.build.files += ["build/icon.png"]' package.json > p.json && mv p.json package.json
          npm install --no-save --no-audit --no-fund electron@33.2.1 electron-builder@25.1.8
          npx electron-builder --win nsis --x64 --publish never
          EXE="$(ls dist/*.exe | head -1)"
          OUT="AMMO-TAX-Setup-$VER.exe"
          cp "$EXE" "$W/$OUT"
          cd "$W"
          SHA="$(sha256sum "$OUT" | cut -d' ' -f1)"
          echo "setup=$OUT sha=$SHA"
          gh release upload "$TAG" "$OUT" -R "$REPO" --clobber
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main
          CUR="$(jq -r .version ammo-tax/update.json)"
          if [ "$CUR" != "$VER" ]; then echo "Feed artıq başqa versiyadadır ($CUR) — dəyişdirilmir."; exit 0; fi
          URL="https://github.com/$REPO/releases/download/$TAG/$OUT"
          jq --arg u "$URL" --arg s "$SHA" '. + {setup: $u, sha256: $s}' ammo-tax/update.json > t.json
          mv t.json ammo-tax/update.json
          cat ammo-tax/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ammo-tax/update.json
          git commit -m "ammo-tax feed -> $VER (setup.exe)" || echo "deyisiklik yoxdur"
          git push origin HEAD:main
